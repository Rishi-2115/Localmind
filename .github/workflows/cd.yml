name: CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-multiarch:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU for multi-arch simulation
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push API multi-arch image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/localmind-api:latest
          
      - name: Build and push Ingestion multi-arch image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ingestion/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/localmind-ingestion:latest

      - name: Build and push Web multi-arch image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./services/web
          file: services/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/localmind-web:latest
