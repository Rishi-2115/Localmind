apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localmind-tenant-template
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/localmind.git'
    path: infra/helm/localmind
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tenant-placeholder # Managed via script or ArgoCD AppSet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
