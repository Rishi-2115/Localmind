apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "localmind.fullname" . }}-default-deny-ingress
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "localmind.fullname" . }}-allow-web
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "localmind.name" . }}-web
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {} # Allow from Ingress controller (usually in another namespace)
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "localmind.fullname" . }}-allow-api
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "localmind.name" . }}-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {} # Allow from Ingress controller
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "localmind.name" . }}-web
    ports:
    - protocol: TCP
      port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "localmind.fullname" . }}-allow-backends
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "localmind.name" . }}-postgres
          - {{ include "localmind.name" . }}-redis
          - {{ include "localmind.name" . }}-minio
          - {{ include "localmind.name" . }}-ollama
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "localmind.name" . }}-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "localmind.name" . }}-ingestion
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ include "localmind.name" . }}-ollama-init
