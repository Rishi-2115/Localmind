apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "localmind.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "localmind.name" . }}-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "localmind.name" . }}-web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports:
            - containerPort: 80
              name: http
          resources:
{{ toYaml .Values.web.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localmind.fullname" . }}-web
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-web
spec:
  ports:
    - port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-web
