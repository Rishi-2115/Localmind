{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "localmind.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "localmind.name" . }}-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "localmind.name" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
              name: redis
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localmind.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-redis
spec:
  ports:
    - port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-redis
{{- end }}
