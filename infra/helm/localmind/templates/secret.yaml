{{- $secretName := printf "%s-secrets" (include "localmind.fullname" .) -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $postgresPassword := "" -}}
{{- $minioPassword := "" -}}
{{- $adminPassword := "" -}}

{{- if $secret -}}
  {{- $postgresPassword = index $secret.data "POSTGRES_PASSWORD" | b64dec -}}
  {{- $minioPassword = index $secret.data "MINIO_ROOT_PASSWORD" | b64dec -}}
  {{- $adminPassword = index $secret.data "DEFAULT_ADMIN_PASSWORD" | b64dec -}}
{{- else -}}
  {{- $postgresPassword = .Values.postgres.password | default (randAlphaNum 16) -}}
  {{- $minioPassword = .Values.minio.rootPassword | default (randAlphaNum 16) -}}
  {{- $adminPassword = .Values.global.adminPassword | default (randAlphaNum 16) -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $postgresPassword | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | b64enc | quote }}
  MINIO_SECRET_KEY: {{ $minioPassword | b64enc | quote }}
  MINIO_ROOT_USER: {{ "minioadmin" | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ "minioadmin" | b64enc | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ $adminPassword | b64enc | quote }}
