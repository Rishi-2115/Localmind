{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "localmind.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-postgres
spec:
  serviceName: {{ include "localmind.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "localmind.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "localmind.name" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: {{ include "localmind.fullname" . }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "localmind.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
          resources:
{{ toYaml .Values.postgres.resources | indent 12 }}
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "user", "-d", "localmind"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localmind.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-postgres
spec:
  ports:
    - port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-postgres
{{- end }}
