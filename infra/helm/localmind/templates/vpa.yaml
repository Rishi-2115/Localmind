{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "localmind.fullname" . }}-api-vpa
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-api
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ include "localmind.fullname" . }}-api
  updatePolicy:
    updateMode: "Off" # Recommendations only, no automatic disruptive pod evictions
  resourcePolicy:
    containerPolicies:
      - containerName: api
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "localmind.fullname" . }}-ingestion-vpa
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-ingestion
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ include "localmind.fullname" . }}-ingestion
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: ingestion
        minAllowed:
          cpu: 200m
          memory: 256Mi
        maxAllowed:
          cpu: 8000m
          memory: 16Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "localmind.fullname" . }}-ollama-vpa
  labels:
    app.kubernetes.io/name: {{ include "localmind.name" . }}-ollama
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: {{ include "localmind.fullname" . }}-ollama
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: ollama
        minAllowed:
          cpu: 1000m
          memory: 4Gi
        maxAllowed:
          cpu: 16000m
          memory: 64Gi
{{- end }}
