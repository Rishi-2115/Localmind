[pytest]
# LocalMind test suite configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (no external services required)
    integration: Integration tests (require running Docker stack)
    eval: RAG quality evaluation tests

# Test output
addopts = -v --tb=short

# Ignore common non-test directories
norecursedirs = .git __pycache__ node_modules .pytest_cache services/web
